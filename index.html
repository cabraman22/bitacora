/* ==========================================================================
   IMPORTAR DESDE GOODREADS
   Goodreads cerró su API pública en 2020 y no da llaves nuevas, así que la vía
   real es su exportación a CSV — que sigue funcionando y trae más que la API.
   El lector busca las columnas por nombre, así que aguanta que Goodreads
   cambie el orden o quite alguna.
   ========================================================================== */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // BOM
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || '').trim());
}

/* "El nombre del viento (Crónica del asesino de reyes, #1)" → título + saga + número */
function splitSeries(raw) {
  const m = raw.match(/^(.*?)\s*\(([^()]+?),?\s*#([\d.]+)\s*\)\s*$/);
  if (m) return { title: m[1].trim(), series: m[2].trim().replace(/,$/, ''), seriesIndex: parseFloat(m[3]) };
  return { title: raw.trim(), series: '', seriesIndex: null };
}

const GR_SHELF = { 'read': 'done', 'currently-reading': 'active', 'to-read': 'backlog' };

function readGoodreads(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('El archivo está vacío.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = name => head.indexOf(name.toLowerCase());
  const iTitle = col('Title');
  if (iTitle < 0) throw new Error('No parece una exportación de Goodreads: no encuentro la columna "Title".');

  const idx = {
    title: iTitle, author: col('Author'), pages: col('Number of Pages'),
    myRating: col('My Rating'), shelf: col('Exclusive Shelf'), shelves: col('Bookshelves'),
    review: col('My Review'), dateRead: col('Date Read'), dateAdded: col('Date Added'),
    isbn: col('ISBN'), isbn13: col('ISBN13'), year: col('Year Published')
  };
  const g = (r, k) => idx[k] >= 0 ? (r[idx[k]] || '').trim() : '';
  const cleanISBN = v => (v || '').replace(/[="\s]/g, '');
  const toDate = v => { const d = new Date(v); return isNaN(d) ? '' : todayKey(d); };

  const out = [];
  for (const r of rows.slice(1)) {
    const rawTitle = g(r, 'title');
    if (!rawTitle) continue;
    const { title, series, seriesIndex } = splitSeries(rawTitle);
    const shelf = g(r, 'shelf').toLowerCase();
    const status = GR_SHELF[shelf] || 'backlog';
    const pages = parseInt(g(r, 'pages')) || null;
    const isbn = cleanISBN(g(r, 'isbn13')) || cleanISBN(g(r, 'isbn'));
    const shelves = g(r, 'shelves').split(',').map(s => s.trim())
      .filter(s => s && !GR_SHELF[s]);
    const dateRead = toDate(g(r, 'dateRead'));
    const dateAdded = toDate(g(r, 'dateAdded'));

    out.push({
      title, series, seriesIndex,
      author: g(r, 'author'),
      pages,
      currentPage: status === 'done' && pages ? pages : 0,
      status,
      rating: parseInt(g(r, 'myRating')) || 0,
      notes: g(r, 'review'),
      subjects: shelves,
      cover: isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : '',
      isbn,
      addedAt: dateAdded || todayKey(),
      lastTouched: dateRead || dateAdded || todayKey()
    });
  }
  return out;
}

  sheet('Confirmar', `
    <div class="stack">
      <div style="font-size:14.5px;line-height:1.6">${esc(msg)}</div>
      <button class="btn btn-danger btn-block" data-act="confirmYes">${esc(label)}</button>
      <button class="btn btn-ghost btn-block" data-act="confirmNo">Cancelar</button>
    </div>`);
}

/* ==========================================================================
   ACCIONES
   ========================================================================== */
function handleAction(act, d, el) {
  const it = () => findItem(d.kind, d.id);
  switch (act) {
    /* navegación */
    case 'go': go(d.r); closeSheet(); break;
    case 'tab': S.ui[d.kindtab] = d.v; save(); render(); break;
    case 'toggleBacklog': S.ui.gameTab = 'pendientes'; go('juegos'); break;

    /* confirmación */
    case 'confirmYes': { const f = pendingConfirm; pendingConfirm = null; closeSheet(); f && f(); break; }
    case 'confirmNo': pendingConfirm = null; closeSheet(); break;

    /* ¿qué sigo? */
    case 'next': openNext(); break;
    case 'nextTime': nextState.minutes = +d.v; sheet('¿Qué sigo?', nextSheetHTML()); break;
    case 'nextMood': nextState.mood = nextState.mood === d.v ? null : d.v; sheet('¿Qué sigo?', nextSheetHTML()); break;
    case 'nextSkip': nextState.skipped.push(d.id); $('#nextResult').innerHTML = nextResultHTML(); break;
    case 'nextReset': nextState.skipped = []; sheet('¿Qué sigo?', nextSheetHTML()); break;
    case 'nextGo': {
      const x = findItem(d.kind, d.id);
      if (x) { x.status = 'active'; x.lastTouched = todayKey(); save(true); }
      closeSheet(); go('hoy'); toast('Va. Está en curso.');
      break;
    }
    case 'nextAsk': claudeBridge(promptForBacklog(nextState.minutes, nextState.mood), 'Que Claude elija'); break;
    case 'askBacklog': claudeBridge(promptForBacklog(null, null), 'Que Claude elija'); break;

    /* tiempo */
    case 'timerStart': startTimer(d.kind, d.id); closeSheet(); toast('Cronómetro corriendo'); break;
    case 'timerStop': stopTimer(d.kind, d.id); closeSheet(); break;
    case 'quick': {
      const x = it(); if (!x) break;
      if (x.status === 'backlog') x.status = 'active';
      logSession(d.kind, d.id, x.title, +d.min);
      toast(`+${fmtMin(+d.min)} en ${x.title}`);
      render(); if ($('#sheetBody')) reopenItem(d.kind, d.id);
      break;
    }
    case 'syncHours': break; // se maneja en change

    /* elementos */
    case 'addGame': openAdd('game'); break;
    case 'addBook': openAdd('book'); break;
    case 'openItem': reopenItem(d.kind, d.id); break;
    case 'manualAdd': openManual(d.kind); break;
    case 'doSearch': runSearch(d.kind); break;
    case 'pick': {
      const r = searchCache[+d.i]; if (!r) break;
      const data = d.kind === 'book'
        ? { title: r.title, author: r.author, pages: r.pages, cover: r.cover, subjects: r.subjects, currentPage: 0 }
        : { title: r.title, cover: r.cover, hltbMain: r.hltbMain, metacritic: r.metacritic, tags: r.tags, extId: r.extId, platform: (r.platforms || [])[0] || '' };
      const created = newItem(d.kind, data);
      closeSheet(); render(); toast(`"${r.title}" agregado`);
      if (d.kind === 'game' && r.extId) {
        API.gameDetail(r.extId).then(det => {
          if (det) { created.series = det.series || ''; created.website = det.website; save(true); }
        }).catch(() => { });
      }
      break;
    }
    case 'saveManual': {
      const t = $('#mTitle').value.trim();
      if (!t) { toast('Ponle un título'); break; }
      // los hobbies propios no traen los campos de juegos ni de libros
      const val = sel => { const el = $(sel); return el ? el.value.trim() : ''; };
      const data = { title: t, series: val('#mSeries'), status: $('#mStatus').value };
      if (d.kind === 'book') { data.author = val('#mAuthor'); data.pages = +val('#mPages') || null; data.currentPage = 0; }
      else if (d.kind === 'game') { data.platform = val('#mPlatform'); data.hltbMain = +val('#mHours') || null; }
      newItem(d.kind, data); closeSheet(); render(); toast(`"${t}" agregado`);
      break;
    }
    case 'setStatus': {
      const x = it(); if (!x) break;
      x.status = d.v; x.lastTouched = todayKey();
      if (d.v === 'done') x.percent = 100, x.currentPage = x.pages || x.currentPage;
      save(true); render();
      if ($('#sheetBody')) reopenItem(d.kind, d.id);
      if (d.v === 'done') toast('Terminado. Bien ahí.');
      if (d.v === 'dropped') toast('Soltado. Sin culpa.');
      break;
    }
    case 'retomar': { const x = it(); if (x) { x.lastTouched = todayKey(); save(true); render(); toast('Va de nuevo'); } break; }
    case 'drop': { const x = it(); if (x) { x.status = 'dropped'; x.lastTouched = todayKey(); save(true); render(); toast('Soltado. Sin culpa.'); } break; }
    case 'toggleTag': {
      const x = it(); if (!x) break;
      x.tags = x.tags || [];
      const i = x.tags.indexOf(d.v);
      i >= 0 ? x.tags.splice(i, 1) : x.tags.push(d.v);
      save(true); reopenItem(d.kind, d.id);
      break;
    }
    /* etapas */
    case 'toggleHideDone': S.ui.hideDone = !S.ui.hideDone; save(); openItem(d.kind || 'game', d.id); break;
    case 'doneStage': {
      const x = it(); if (!x) break;
      const s = (x.stages || []).find(s => s.id === d.sid);
      if (s) { s.done = true; x.lastTouched = todayKey(); afterStageChange(x, d.kind); save(true); reopenItem(d.kind, d.id); }
      break;
    }
    case 'delStage': {
      const x = it(); if (!x) break;
      x.stages = (x.stages || []).filter(s => s.id !== d.sid);
      save(true); reopenItem(d.kind, d.id);
      break;
    }
    case 'addStage': openAddStage(d.kind, d.id); break;
    case 'doAddStage': {
      const t = ($('#stOne') || {}).value?.trim();
      if (!t) { toast('Escribe algo'); break; }
      addStages(d.kind, d.id, [t], $('#stSection').value);
      closeSheet(); reopenItem(d.kind, d.id);
      break;
    }
    case 'pasteStages': openPasteStages(d.kind, d.id); break;
    case 'doPasteStages': {
      const lines = parseStageLines(($('#stText') || {}).value || '');
      if (!lines.length) { toast('No encontré líneas aprovechables'); break; }
      const n = addStages(d.kind, d.id, lines, $('#stSection').value);
      closeSheet(); reopenItem(d.kind, d.id);
      toast(n ? `${n} etapas agregadas` : 'Ya las tenías todas');
      break;
    }
    case 'claudeStages': {
      const x = it(); if (!x) break;
      claudeBridge(promptForStages(x, d.kind), `Lista para ${x.title}`);
      break;
    }
    case 'autoChapters': openAutoChapters(d.kind, d.id); break;
    case 'doAutoChapters': {
      const n = clamp(+$('#chN').value || 0, 1, 300);
      const from = +$('#chFrom').value || 1;
      const word = ($('#chWord').value || 'Capítulo').trim();
      const texts = Array.from({ length: n }, (_, i) => `${word} ${from + i}`);
      const added = addStages(d.kind, d.id, texts, d.kind === 'book' ? 'capitulos' : 'historia');
      closeSheet(); reopenItem(d.kind, d.id);
      toast(`${added} ${word.toLowerCase()}s creados`);
      break;
    }
    case 'wikiStages': openWikiStages(d.id); break;
    case 'doWikiSearch': doWikiSearch(); break;
    case 'pickWiki': pickWiki(d.i); break;
    case 'doWikiImport': {
      const sec = ($('#stSection') || {}).value || 'historia';
      const n = addStages('game', wikiTarget, wikiSections.map(s => s.text), sec);
      const x = findItem('game', wikiTarget);
      if (x) {
        x.sources = x.sources || [];
        if (!x.sources.some(s => s.url === d.url))
          x.sources.push({ name: 'StrategyWiki: ' + d.title, url: d.url, license: 'CC BY-SA 3.0' });
        save(true);
      }
      closeSheet(); openItem('game', wikiTarget);
      toast(`${n} etapas desde StrategyWiki`);
      break;
    }
    case 'rawgStages': importAchievements(d.id); break;

    /* datos incompletos */
    case 'refreshItem': refreshItem(d.kind, d.id); break;
    case 'refreshAll': refreshAll(); break;

    /* hobbies propios */
    case 'modules': openModules(); break;
    case 'addToModule': openManual(d.kind); break;
    case 'saveModule': {
      const name = ($('#modName') || {}).value?.trim();
      if (!name) { toast('Ponle nombre'); break; }
      let id = slugify(name), n = 2;
      while (S.modules.some(m => m.id === id)) id = slugify(name) + '-' + n++;
      const tint = ($('#modTints .swatch[aria-pressed="true"]') || {}).dataset?.tint || MOD_TINTS[0];
      S.modules.push({
        id, name, icon: ($('#modIcon').value || '•').trim().slice(0, 2),
        unit: ($('#modUnit').value || '').trim() || 'elemento', tint, createdAt: todayKey()
      });
      S.custom[id] = S.custom[id] || [];
      save(true); closeSheet(); go('mod:' + id);
      toast(`"${name}" creado`);
      break;
    }
    case 'delModule': {
      const m = S.modules.find(x => x.id === d.id); if (!m) break;
      const n = (S.custom[m.id] || []).length;
      askConfirm(`¿Borrar "${m.name}"${n ? ` y sus ${n} elementos` : ''}? No se puede deshacer.`, 'Borrar hobby', () => {
        S.modules = S.modules.filter(x => x.id !== d.id);
        delete S.custom[d.id];
        delete S.settings.customFields['mod:' + d.id];
        if (S.ui.route === 'mod:' + d.id) S.ui.route = 'hoy';
        save(true); render(); toast('Borrado');
      });
      break;
    }

    /* apariencia */
    case 'appearance': openAppearance(); break;
    case 'setAccent': S.settings.accent = d.v === 'auto' ? '' : d.v; save(); applyAppearance(); openAppearance(); break;
    case 'setTint': S.settings[d.f] = d.v === 'auto' ? '' : d.v; save(); applyAppearance(); openAppearance(); break;
    case 'setDensity': S.settings.density = d.v; save(); applyAppearance(); openAppearance(); break;
    case 'resetLook': {
      Object.assign(S.settings, { accent: '', tintGame: '', tintBook: '', tintMagic: '', fontScale: 100, density: 'normal' });
      save(); applyAppearance(); openAppearance(); toast('Como al principio');
      break;
    }

    /* campos propios */
    case 'manageFields': openFields(d.kind); break;
    case 'addField': {
      const label = ($('#fLabel') || {}).value?.trim();
      if (!label) { toast('Ponle nombre al campo'); break; }
      const cf = S.settings.customFields;
      cf[d.kind] = cf[d.kind] || [];
      cf[d.kind].push({
        id: uid(), label, type: $('#fType').value,
        options: ($('#fOpts').value || '').split(',').map(s => s.trim()).filter(Boolean)
      });
      save(true); openFields(d.kind);
      break;
    }
    case 'delField': {
      const cf = S.settings.customFields;
      cf[d.kind] = (cf[d.kind] || []).filter(f => f.id !== d.fid);
      save(true); openFields(d.kind);
      break;
    }
    case 'delItem': {
      const x = it(); if (!x) break;
      askConfirm(`¿Borrar "${x.title}"? No se puede deshacer.`, 'Borrar', () => {
        if (d.kind === 'book') S.books = S.books.filter(b => b.id !== d.id);
        else S.games = S.games.filter(g => g.id !== d.id);
        save(true); render(); toast('Borrado');
      });
      break;
    }
    case 'askItem': { const x = it(); if (x) claudeBridge(promptForItem(x, d.kind), x.title); break; }
    case 'setStars': { const x = it(); if (x) { x.rating = +d.v; save(true); reopenItem(d.kind, d.id); } break; }

    /* magic */
    case 'addDeck': openAddDeck(); break;
    case 'openDeck': openDeck(d.id); break;
    case 'saveDeck': {
      const name = $('#dName').value.trim();
      if (!name) { toast('Ponle nombre'); break; }
      const deck = {
        id: uid(), name, format: $('#dFormat').value, commander: $('#dCmd').value.trim(),
        cards: [], notes: '', createdAt: todayKey()
      };
      S.decks.unshift(deck); save(true);
      const raw = $('#dList').value.trim();
      closeSheet(); render();
      if (raw) resolveInto(deck.id, parseList(raw), true);
      else toast('Deck creado');
      break;
    }
    case 'setDeck': break; // change
    case 'pasteList': openPasteList(d.id); break;
    case 'doPaste': {
      const raw = ($('#pList') || {}).value || '';
      const replace = ($('#pReplace') || {}).checked;
      const items = parseList(raw);
      if (!items.length) { toast('No encontré cartas en ese texto'); break; }
      resolveInto(d.id, items, replace);
      break;
    }
    case 'delCard': {
      const dk = S.decks.find(x => x.id === d.id); if (!dk) break;
      dk.cards = dk.cards.filter(c => c.name !== d.cn);
      save(true); openDeck(d.id);
      break;
    }
    case 'delDeck': {
      const dk = S.decks.find(x => x.id === d.id); if (!dk) break;
      askConfirm(`¿Borrar el deck "${dk.name}"? Sus partidas se quedan en el historial.`, 'Borrar deck', () => {
        S.decks = S.decks.filter(x => x.id !== d.id); save(true); render(); toast('Deck borrado');
      });
      break;
    }
    case 'askDeck': { const dk = S.decks.find(x => x.id === d.id); if (dk) claudeBridge(promptForDeck(dk), dk.name); break; }
    case 'addMatch': openAddMatch(d.deck); break;
    case 'saveMatch': {
      const res = $('#wResult .chip.on');
      S.matches.push({
        id: uid(), deckId: $('#wDeck').value, opponent: $('#wOpp').value.trim(),
        result: res ? res.dataset.r : 'W', games: $('#wGames').value.trim(),
        date: $('#wDate').value || todayKey(), notes: $('#wNotes').value.trim()
      });
      save(true); closeSheet(); render(); toast('Partida registrada');
      break;
    }
    case 'delMatch': S.matches = S.matches.filter(m => m.id !== d.id); save(true); render(); break;
    case 'addCard': openAddCard(); break;
    case 'doCardSearch': doCardSearch(); break;
    case 'pickCard': {
      const c = cardCache[+d.i]; if (!c) break;
      const ex = S.collection.find(x => x.scryfallId === c.scryfallId);
      if (ex) ex.qty++;
      else S.collection.push({ ...c, id: uid(), qty: 1, foil: false, addedAt: todayKey() });
      save(true); render(); toast(`${c.name} agregada`);
      break;
    }
    case 'delColl': S.collection = S.collection.filter(x => x.id !== d.id); save(true); render(); break;
    case 'refreshPrices': refreshPrices(); break;

    /* perfil y ajustes */
    case 'quiz': openQuiz(); break;
    case 'saveQuiz': {
      const a = {};
      $$('[data-quiz]').forEach(g => {
        a[g.dataset.quiz] = $$('.chip.on', g).map(c => c.dataset.qk);
      });
      a.duracion = $('#qDur').value;
      a.dificultad = $('#qDif').value;
      a.duracionLibros = $('#qDurL').value;
      S.profile.answers = a;
      S.profile.favGames = $('#qFavG').value.split(',').map(s => s.trim()).filter(Boolean);
      S.profile.favSagas = $('#qFavS').value.split(',').map(s => s.trim()).filter(Boolean);
      S.profile.done = true;
      save(true); closeSheet(); render(); toast('Perfil guardado');
      break;
    }
    case 'setSetting': break; // change

    /* actualización */
    case 'checkUpdate': checkUpdate(); break;

    /* goodreads */
    case 'goodreads': openGoodreads(); break;
    case 'grPick': grPick(); break;
    case 'grImport': grImport(d.mode); break;

    /* respaldo */
    case 'exportJSON': exportJSON(); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': importJSON(); break;
    case 'wipe': askConfirm('Esto borra todos tus juegos, libros, decks y partidas. Exporta un respaldo antes si no estás seguro.', 'Borrar todo', () => {
      S = structuredClone(BLANK); save(true); applyTheme(); render(); toast('Todo limpio');
    }); break;

    /* puente con claude */
    case 'bridgeOpen': {
      const t = ($('#bridgeTxt') || {}).value || '';
      window.open('https://claude.ai/new?q=' + encodeURIComponent(t), '_blank', 'noopener');
      break;
    }
    case 'bridgeCopy': {
      const t = ($('#bridgeTxt') || {}).value || '';
      navigator.clipboard?.writeText(t).then(() => toast('Copiado — pégalo en Claude'))
        .catch(() => { const ta = $('#bridgeTxt'); ta.select(); toast('Selecciónalo y cópialo'); });
      break;
    }
    case 'bridgeInline': bridgeInline(); break;
  }
}

/* mini-prompt sin diálogos del navegador */
function prompt2(label, cb) {
  sheet(label, `<div class="stack">
    <input type="text" id="p2" placeholder="Escríbelo aquí">
    <button class="btn btn-primary btn-block" id="p2ok">Agregar</button></div>`, b => {
    const i = b.querySelector('#p2'); i.focus();
    const done = () => { const v = i.value.trim(); closeSheet(); cb(v); };
    b.querySelector('#p2ok').onclick = done;
    i.onkeydown = e => { if (e.key === 'Enter') done(); };
  });
}

/* ---------- resolver listas de Magic ---------- */
async function resolveInto(deckId, items, replace) {
  const dk = S.decks.find(x => x.id === deckId); if (!dk) return;
  const st = $('#pStatus');
  if (st) st.innerHTML = `<div class="dim" style="font-size:13.5px;padding-top:10px">Resolviendo ${items.length} cartas…</div>`;
  else toast('Resolviendo lista…');
  try {
    const { cards, missing } = await API.resolveList(items.map(i => i.name));
    const srcOf = n => items.find(i => i.name.toLowerCase() === n.toLowerCase()) || {};
    const resolved = cards.map(c => {
      const src = srcOf(c.name);
      return { ...c, qty: src.qty || 1, proxy: !!src.proxy };
    });
    dk.cards = replace ? resolved : mergeCards(dk.cards || [], resolved);
    save(true); closeSheet(); render();
    toast(missing.length ? `${resolved.length} cartas · ${missing.length} no encontradas` : `${resolved.length} cartas agregadas`);
    if (missing.length) setTimeout(() => toast('No encontradas: ' + missing.slice(0, 3).join(', ')), 2800);
  } catch (e) {
    if (st) st.innerHTML = `<div class="banner" style="margin-top:10px">${ico('info')}<div>No se pudo conectar a Scryfall. Intenta de nuevo o captura las cartas a mano.</div></div>`;
    else toast('No se pudo conectar a Scryfall');
  }
}
function mergeCards(a, b) {
  const map = new Map(a.map(c => [c.name, { ...c }]));
  b.forEach(c => {
    const e = map.get(c.name);
    if (e) { e.qty += c.qty; e.proxy = e.proxy || c.proxy; } // si ya era proxy, se queda proxy
    else map.set(c.name, c);
  });
  return [...map.values()];
}
async function refreshPrices() {
  if (!S.collection.length) return;
  toast('Actualizando precios…');
  try {
    const { cards } = await API.resolveList(S.collection.map(c => c.name));
    const byName = new Map(cards.map(c => [c.name.toLowerCase(), c]));
    S.collection.forEach(c => { const f = byName.get(c.name.toLowerCase()); if (f) c.price = f.price; });
    save(true); render(); toast('Precios actualizados');
  } catch (e) { toast('No se pudo conectar a Scryfall'); }
}

/* ==========================================================================
   ENTRADAS (campos de texto, selects, checkboxes)
   ========================================================================== */
function applyInput(el) {
  const act = el.dataset.act;
  if (act === 'setField') {
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    const f = el.dataset.f;
    let v = el.type === 'number' || el.type === 'range' ? (el.value === '' ? null : +el.value) : el.value;
    x[f] = v;
    x.lastTouched = todayKey();
    if (f === 'currentPage' || f === 'percent' || f === 'pages') {
      const pct = itemPercent({ ...x, kind: el.dataset.kind });
      const sheetBar = el.closest('.stack-lg')?.querySelector('.bar > i');
      if (sheetBar) sheetBar.style.width = pct + '%';
      const lbl = el.closest('div')?.parentElement?.querySelector('.num');
      if (lbl && lbl.textContent.includes('%')) lbl.textContent = pct + '%';
      if (pct >= 100 && x.status === 'active') { x.status = 'done'; toast('¡Terminado!'); }
      if (pct > 0 && pct < 100 && x.status === 'backlog') x.status = 'active';
    }
    save();
  }
  else if (act === 'syncHours') {
    if (el.value === '') return;
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    const target = Math.round(+el.value * 60);
    const delta = target - (x.minutes || 0);
    x.minutes = target; x.lastTouched = todayKey();
    if (delta > 0) S.sessions.push({ id: uid(), kind: el.dataset.kind, refId: x.id, title: x.title, min: delta, date: todayKey() });
    save(true); toast(`Total ajustado a ${fmtHrs(target)}`);
    openItem(el.dataset.kind, el.dataset.id);
  }
  else if (act === 'toggleNoTime') {
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    x.noTime = el.checked; save(true); openItem(el.dataset.kind, el.dataset.id);
  }
  else if (act === 'toggleStage') {
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    const s = (x.stages || []).find(s => s.id === el.dataset.sid); if (!s) return;
    s.done = el.checked;
    x.lastTouched = todayKey();
    afterStageChange(x, el.dataset.kind);
    save(true);
    reopenItem(el.dataset.kind, el.dataset.id);
  }
  else if (act === 'setCustom') {
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    x.custom = x.custom || {};
    x.custom[el.dataset.fid] = el.type === 'checkbox' ? el.checked
      : el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
    x.lastTouched = todayKey();
    save();
  }
  else if (act === 'setAppearance') {
    const f = el.dataset.f;
    S.settings[f] = el.type === 'range' || el.type === 'number' ? +el.value : el.value;
    save(); applyAppearance();
    if (f === 'fontScale') { const o = $('#fsOut'); if (o) o.textContent = el.value + '%'; }
  }
  else if (act === 'toggleCheck') {
    const x = findItem(el.dataset.kind, el.dataset.id); if (!x) return;
    const c = (x.checklist || []).find(c => c.id === el.dataset.cid);
    if (c) { c.done = el.checked; x.lastTouched = todayKey(); save(true); }
  }
  else if (act === 'toggleProxy') {
    const dk = S.decks.find(x => x.id === el.dataset.id); if (!dk) return;
    const c = (dk.cards || []).find(c => c.name === el.dataset.cn); if (!c) return;
    c.proxy = el.checked;
    save(true);
    const row = el.closest('tr');
    if (row) row.classList.toggle('is-proxy', c.proxy);
    const price = row?.querySelector('td:nth-child(4) span');
    if (price) price.style.cssText = c.proxy ? 'opacity:.45;text-decoration:line-through' : '';
    // refresca el resumen de arriba sin cerrar la hoja
    const s = deckStats(dk);
    const val = $('#sheetBody .statgrid .stat:nth-child(2) b');
    if (val) val.innerHTML = `${fmtMoney(s.value).replace('$', '')}<span style="font-size:12px"> usd</span>`;
    const lbl = $('#sheetBody .statgrid .stat:nth-child(2) span:last-child');
    if (lbl) lbl.textContent = s.proxyQty ? 'lo que tienes' : 'valor';
  }
  else if (act === 'setDeck') {
    const dk = S.decks.find(x => x.id === el.dataset.id); if (!dk) return;
    dk[el.dataset.f] = el.value; save();
  }
  else if (act === 'setSetting') {
    const f = el.dataset.f, t = el.dataset.type;
    if (t === 'bool') S.settings[f] = el.checked;
    else if (t === 'num') S.settings[f] = +el.value;
    else if (t === 'hours') S.settings.weeklyGoalMin = Math.round((+el.value || 0) * 60);
    else S.settings[f] = el.value;
    save();
    if (t === 'bool' || t === 'num' || t === 'hours') render();
  }
}
document.addEventListener('input', e => { if (e.target.dataset?.act) applyInput(e.target); });
document.addEventListener('change', e => { if (e.target.dataset?.act) applyInput(e.target); });

/* cierra hoja → refresca la vista de abajo */
const _closeSheet = closeSheet;
closeSheet = function () { _closeSheet(); render(); };

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
migrate();
applyAppearance();
render();
API.probe().then(() => { if (API.online === false) render(); });

</script>

<script>
/* Service worker: hace que la app abra sin internet */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw:', e));
  });
}
</script>
